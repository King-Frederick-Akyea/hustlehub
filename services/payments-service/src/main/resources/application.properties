spring.application.name=payments-service
# Kept off the 8081-8084 range - reserved by Expo/Metro bundler ports.
server.port=${SERVER_PORT:8185}

# --- Database (host/port/name/user have safe defaults; password has none on purpose) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hustlehub_payments}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes; Hibernate only ever validates entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT: secret has no default here on purpose (see application-dev.properties for the dev-only default).
app.jwt.secret=${JWT_SECRET}

# Shared secret required on every /internal/** request from other services (see InternalPaymentsController).
app.internal.key=${INTERNAL_API_KEY}

# common's broad component scan (scanBasePackages=com.hustlehub) unconditionally instantiates
# UserServiceClientImpl, PaymentsServiceClientImpl, and NotificationsServiceClientImpl, all of
# which call RestClient.create(url)/RestClient.builder().baseUrl(url) in their constructor - every
# property must be set or the app fails to boot even though this service never actually calls
# identity-service today. payments.url is self-referential on purpose.
app.services.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8181}
app.services.payments.url=${PAYMENTS_SERVICE_URL:http://localhost:8185}
app.services.notifications.url=${NOTIFICATIONS_SERVICE_URL:http://localhost:8184}

# Paystack (test mode). secret-key has no real default (blank) so a fresh checkout still boots
# cleanly - PaystackClient only fails, with a clear error, the first time an endpoint actually
# needs it. callback-url is optional; Paystack falls back to the dashboard's default when blank.
app.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
app.paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
app.paystack.callback-url=${PAYSTACK_CALLBACK_URL:}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
