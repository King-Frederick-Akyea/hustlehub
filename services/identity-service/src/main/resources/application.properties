spring.application.name=identity-service
# Not 8081 - that's Expo/Metro's default bundler port, and this app needs to run
# alongside the frontend dev server, not fight it for a port.
server.port=${SERVER_PORT:8181}

# --- Database (host/port/name/user have safe defaults; password has none on purpose) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hustlehub_identity}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes; Hibernate only ever validates entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Safety net for a schema that was copied over from the monolith's DB (already has V1-V6's
# tables and data, but no flyway_schema_history) — baselines at V6 instead of failing or trying
# to re-run "CREATE TABLE" on tables that already exist. No-op once history exists.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=6

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# JWT: secret has no default here on purpose (see application-dev.properties for the dev-only default).
# Must be the same secret the monolith/other services use, so existing tokens keep validating.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:15}
app.jwt.refresh-token-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# Shared secret required on every /internal/** request from other services (see InternalUserController).
app.internal.key=${INTERNAL_API_KEY}

# This service's own base URL. Not used by identity-service itself today (nothing here calls
# UserServiceClient — it IS the identity source of truth) but common's broad component scan
# (scanBasePackages=com.hustlehub) instantiates UserServiceClientImpl unconditionally, and it
# fails fast at startup if app.services.identity.url is unset (RestClient.create(null)). Points
# at itself so that bean always constructs cleanly even though it's never actually invoked here.
app.services.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8181}
# Same reasoning: common's PaymentsServiceClient/NotificationsServiceClient beans are
# unconditionally instantiated too.
app.services.payments.url=${PAYMENTS_SERVICE_URL:http://localhost:8185}
app.services.notifications.url=${NOTIFICATIONS_SERVICE_URL:http://localhost:8184}

app.uploads.base-dir=${UPLOADS_DIR:./uploads}
app.uploads.max-file-size-bytes=${UPLOADS_MAX_FILE_SIZE_BYTES:8388608}

# Dev-only convenience: echoes OTP codes / reset tokens back in API responses so the
# frontend can be exercised end-to-end even if email delivery is slow/misconfigured.
# Defaults to false everywhere; only application-dev.properties turns it on.
app.mail.dev-echo-enabled=${MAIL_DEV_ECHO_ENABLED:false}

# "logging" (default, safe) just logs codes to the console instead of emailing them.
# "brevo" sends real email via Brevo's transactional email HTTP API (requires app.mail.brevo.api-key + app.mail.from-* below).
app.mail.provider=${MAIL_PROVIDER:logging}
app.mail.from-name=${MAIL_FROM_NAME:HustleHub}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
