spring.application.name=messaging-service
# Shared secrets/DB config for every service live in one place: services/.env.properties (gitignored,
# copy from .env.properties.example). "optional:" means a deployment that sets real env vars
# instead (no local file) still boots fine.
spring.config.import=optional:file:../.env.properties
# Kept off the 8081-8082 range - that's Expo/Metro's default + fallback bundler ports, which
# need to keep working alongside this service, not fight it for a port.
server.port=${SERVER_PORT:8183}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hustlehub_messaging}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
app.jwt.secret=${JWT_SECRET}
app.internal.key=${INTERNAL_API_KEY}
app.services.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8181}
app.services.payments.url=${PAYMENTS_SERVICE_URL:http://localhost:8185}
app.services.notifications.url=${NOTIFICATIONS_SERVICE_URL:http://localhost:8184}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
