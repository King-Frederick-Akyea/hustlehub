spring.application.name=tasks-service
# Not 8082 - Expo/Metro falls back to it when 8081 is taken (confirmed colliding with an
# unrelated project's dev server on this machine), so this stays clear of that range entirely.
server.port=${SERVER_PORT:8182}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hustlehub_tasks}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
app.jwt.secret=${JWT_SECRET}
app.internal.key=${INTERNAL_API_KEY}
app.services.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8181}
app.services.payments.url=${PAYMENTS_SERVICE_URL:http://localhost:8185}
app.services.notifications.url=${NOTIFICATIONS_SERVICE_URL:http://localhost:8184}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
