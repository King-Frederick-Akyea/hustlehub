spring.application.name=notifications-service
# Shared secrets/DB config for every service live in one place: services/.env.properties (gitignored,
# copy from .env.properties.example). "optional:" means a deployment that sets real env vars
# instead (no local file) still boots fine.
spring.config.import=optional:file:../.env.properties
# Kept off the 8081-8083 range - reserved by Expo/Metro bundler ports.
server.port=${SERVER_PORT:8184}

# --- Database (host/port/name/user have safe defaults; password has none on purpose) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hustlehub_notifications}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes; Hibernate only ever validates entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT: secret has no default here on purpose (see application-dev.properties for the dev-only default).
app.jwt.secret=${JWT_SECRET}

# Shared secret for internal service-to-service calls (checked by InternalNotificationController).
app.internal.key=${INTERNAL_API_KEY}

# common's UserServiceClient/PaymentsServiceClient/NotificationsServiceClient beans are
# unconditionally instantiated by the broad scanBasePackages=com.hustlehub scan even though this
# service never calls identity/payments and only calls itself via loopback - all three need a
# non-null base URL to construct cleanly.
app.services.identity.url=${IDENTITY_SERVICE_URL:http://localhost:8181}
app.services.payments.url=${PAYMENTS_SERVICE_URL:http://localhost:8185}
app.services.notifications.url=${NOTIFICATIONS_SERVICE_URL:http://localhost:8184}
app.services.tasks.url=${TASKS_SERVICE_URL:http://localhost:8182}
app.services.rentals.url=${RENTALS_SERVICE_URL:http://localhost:8186}
app.services.reviews.url=${REVIEWS_SERVICE_URL:http://localhost:8187}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
