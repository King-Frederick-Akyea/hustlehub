spring.application.name=gateway-service
server.port=${SERVER_PORT:8080}

# Multipart parsing is disabled so avatar/verification-doc uploads pass through as raw bytes
# with their original Content-Type (including multipart boundary) untouched, and get parsed
# once, by the service that actually owns the upload.
spring.servlet.multipart.enabled=false
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Route table - add a prefix/target pair here for every new service. No other file needs to
# change to add a route.
# Downstream services run on 818x, not 808x - Expo/Metro claims 8081 by default and falls back
# to 8082+ when that's taken, so the whole 808x range stays reserved for frontend tooling.
app.gateway.routes[0].prefix=/api/auth
app.gateway.routes[0].target=${IDENTITY_SERVICE_URL:http://localhost:8181}
app.gateway.routes[1].prefix=/api/users
app.gateway.routes[1].target=${IDENTITY_SERVICE_URL:http://localhost:8181}
app.gateway.routes[2].prefix=/api/verification
app.gateway.routes[2].target=${IDENTITY_SERVICE_URL:http://localhost:8181}
app.gateway.routes[3].prefix=/api/tasks
app.gateway.routes[3].target=${TASKS_SERVICE_URL:http://localhost:8182}
app.gateway.routes[4].prefix=/api/bids
app.gateway.routes[4].target=${TASKS_SERVICE_URL:http://localhost:8182}
app.gateway.routes[5].prefix=/api/conversations
app.gateway.routes[5].target=${MESSAGING_SERVICE_URL:http://localhost:8183}
app.gateway.routes[6].prefix=/api/notifications
app.gateway.routes[6].target=${NOTIFICATIONS_SERVICE_URL:http://localhost:8184}
app.gateway.routes[7].prefix=/api/payments
app.gateway.routes[7].target=${PAYMENTS_SERVICE_URL:http://localhost:8185}
app.gateway.routes[8].prefix=/api/listings
app.gateway.routes[8].target=${RENTALS_SERVICE_URL:http://localhost:8186}
app.gateway.routes[9].prefix=/api/offers
app.gateway.routes[9].target=${RENTALS_SERVICE_URL:http://localhost:8186}
app.gateway.routes[10].prefix=/api/reviews
app.gateway.routes[10].target=${REVIEWS_SERVICE_URL:http://localhost:8187}
app.gateway.routes[11].prefix=/api/reports
app.gateway.routes[11].target=${REVIEWS_SERVICE_URL:http://localhost:8187}
